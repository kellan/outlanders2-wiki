name: Weekly link check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch every URL in content/links.json
        run: node scripts/check-links.mjs
