name: Build and test

on:
  pull_request:
  push:
    branches-ignore: [main, gh-pages]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site from content, source and assets
        run: npm run build
      - name: Validate content, links, spoiler isolation and reader pages
        run: npm test
